    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://medium-zoom.francoischalifour.com/#website",
            "url": "https://medium-zoom.francoischalifour.com/",
            "name": "medium-zoom"

            }

    <script>
      try {
        const theme = localStorage.getItem('medium-zoom-theme')
        document.documentElement.classList.toggle(
          'dark',
          theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)
        )
      } catch {}
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
