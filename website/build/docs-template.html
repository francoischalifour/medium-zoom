    <meta property="og:image" content="https://medium-zoom.francoischalifour.com/og-home.jpg" />

    <script type="application/ld+json">
      "__DOC_SCHEMA__"
    </script>
    <script>
      try {
        const theme = localStorage.getItem('medium-zoom-theme')
        document.documentElement.classList.toggle(
          'dark',
          theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)
        )
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
