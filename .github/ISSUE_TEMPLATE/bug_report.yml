name: Bug report
description: Did something not work?
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        For security vulnerabilities, please use [private vulnerability reporting](https://github.com/francoischalifour/medium-zoom/security/advisories/new) instead of opening a public issue.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: How to reproduce
      description: List the steps needed to reproduce the bug.
      placeholder: |
        1. Initialize mediumZoom(selector, options)
        2. Click on the image
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproducible example
      description: |
        Share a minimal reproduction. You can fork the [vanilla JavaScript example on CodeSandbox](https://codesandbox.io/s/github/francoischalifour/medium-zoom/tree/main/examples/vanilla).
      placeholder: https://codesandbox.io/s/your-reproduction
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130, Safari 18, Firefox 132, etc.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: medium-zoom version
      description: The version installed in your project.
    validations:
      required: true
