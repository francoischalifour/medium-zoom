name: Checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      playwright-image: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: bun.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Resolve matching browser image
        id: playwright
        run: bun -e 'console.log("image=mcr.microsoft.com/playwright:v" + require("@playwright/test/package.json").version + "-noble")' >> "$GITHUB_OUTPUT"
      - run: bun run check:library
      - run: bun run build:demo
      - run: bun run test:examples
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build
          path: |
            dist/
            website/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  browser:
    name: ${{ matrix.browser }} (${{ matrix.suite.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ needs.build.outputs.playwright-image }}
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Keep the screenshot-heavy stories separate so test-count sharding cannot
        # put all of them on one runner alongside the API and example tests.
        suite:
          - name: api-and-examples
            args: --grep-invert="API stories"
          - name: stories
            args: --grep="API stories"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-build
      - name: Test ${{ matrix.suite.name }}
        run: bun run test:browser --project="*${{ matrix.browser }}" ${{ matrix.suite.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-evidence-${{ matrix.browser }}-${{ matrix.suite.name }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
