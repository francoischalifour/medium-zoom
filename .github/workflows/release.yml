name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/release-please
      - run: npm test
        working-directory: .github/release-please
      - run: npm run release
        id: release
        working-directory: .github/release-please
        env:
          GITHUB_TOKEN: ${{ github.token }}

  checks:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  publish:
    needs: [release-please, checks]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-build
      - run: node scripts/release-channel.ts latest
      - run: npm publish --tag latest --access public --ignore-scripts

  sync-examples:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun scripts/sync-example-versions.ts "$VERSION"
      - name: Resolve the published package in bun.lock
        run: |
          # npm's registry metadata can lag behind a successful publish.
          for delay in 0 10 30 60; do
            sleep "$delay"
            if bun install --lockfile-only --no-cache --ignore-scripts; then exit 0; fi
          done
          exit 1
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/sync-example-versions
          base: main
          add-paths: |
            examples/*/package.json
            bun.lock
          commit-message: 'chore(examples): use medium-zoom ${{ env.VERSION }}'
          title: 'chore(examples): use medium-zoom ${{ env.VERSION }}'
          body: Updates the standalone examples and their lockfile to the published medium-zoom ${{ env.VERSION }}.
