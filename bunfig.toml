[install]
exact = true

[fmt]
# The only formatter config: the format scripts pass --no-config so a Prettier or oxfmt
# config found above the checkout, as in a nested worktree, cannot change the result.
printWidth = 80
singleQuote = true
semi = false
trailingComma = "es5"
arrowParens = "avoid"
sortImports = true
ignorePatterns = [
  "CHANGELOG.md",
  "bun.lock",
  "**/dist/**",
  "**/.next/**",
  "**/.astro/**",
  "coverage/**",
  ".cache/**",
]

[[fmt.overrides]]
files = ["website/src/docs/examples/*.tsx", "website/src/docs/*.mdx"]
options = { printWidth = 72 }
